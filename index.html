<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>灵魂魔性画师 v2.0 · MOXING DRAW — 真 AI 魔性生图小程序</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-wrap">
    <header class="top-banner">
      <div class="brand">
        <span class="brand-sticker">真 AI 魔性生图 v2.0</span>
        <h1>灵魂魔性画师 <small>MOXING DRAW</small></h1>
        <p class="subtitle">输入任意脑洞描述（比如「数学家梵高」），免费真 AI 实时生成高度贴合又极其魔性的神图！</p>
      </div>
      <div class="engine-switch" id="engine-switch">
        <button id="mode-free-ai" type="button" class="pill-btn active" data-mode="free-ai">🤖 免费真 AI（免 Key）</button>
        <button id="mode-custom-ai" type="button" class="pill-btn" data-mode="custom-ai">🔑 自定义 API（硅基/Gemini）</button>
        <button id="mode-local" type="button" class="pill-btn" data-mode="local">🤪 纯离线涂鸦</button>
      </div>
    </header>

    <main class="studio-grid">
      <!-- Left Control Panel -->
      <section class="panel control-panel">
        <div class="field-block">
          <div class="label-row">
            <label for="prompt-input">✍️ 输入你的任意脑洞描述（中文 / 英文皆可）</label>
            <button id="btn-random" class="tiny-btn" type="button">🎲 随机抽象脑洞</button>
          </div>
          <textarea
            id="prompt-input"
            rows="3"
            placeholder="随便写任何奇葩画面：数学家梵高、爱因斯坦在菜市场砍价、秦始皇骑电瓶车送外卖..."
          >数学家梵高</textarea>
          <div class="preset-chips" id="preset-chips"></div>
        </div>

        <div class="field-block">
          <label>🎨 选择魔性画风（同时驱动 AI 提示词 + 后期特效）</label>
          <div class="style-grid" id="style-grid">
            <button type="button" class="style-card active" data-style="soul">
              <span class="st-ico">🤪</span>
              <b>暴走喜剧漫</b>
              <small>夸张颜艺 + 魔性漫画</small>
            </button>
            <button type="button" class="style-card" data-style="meme">
              <span class="st-ico">🐼</span>
              <b>精神污染梗图</b>
              <small>上下黑边梗字 + 夸张表情</small>
            </button>
            <button type="button" class="style-card" data-style="pixel">
              <span class="st-ico">👾</span>
              <b>鬼畜复古像素</b>
              <small>像素风 + RGB 故障</small>
            </button>
            <button type="button" class="style-card" data-style="cyber">
              <span class="st-ico">⚡</span>
              <b>赛博霓虹崩坏</b>
              <small>荧光科幻 + CRT 扫描</small>
            </button>
            <button type="button" class="style-card" data-style="abstract">
              <span class="st-ico">🌀</span>
              <b>抽象毕加索</b>
              <small>扭曲名画 + 疯癫构图</small>
            </button>
          </div>
        </div>

        <div class="field-block sliders-row">
          <div class="slider-box">
            <div class="label-row">
              <label for="chaos-slider">🌶️ 魔性浓度</label>
              <span id="chaos-val" class="val-badge">78% 精神超前</span>
            </div>
            <input id="chaos-slider" type="range" min="15" max="100" value="78" />
            <label class="check-label small-check">
              <input id="chk-stickers" type="checkbox" checked />
              <span>叠加魔性弹幕贴纸（离谱!/绝了）</span>
            </label>
          </div>
          <div class="caption-box">
            <label class="check-label">
              <input id="chk-caption" type="checkbox" checked />
              <span>底部印上魔性配文</span>
            </label>
            <input id="custom-caption" type="text" placeholder="留空则按描述自动配文..." />
          </div>
        </div>

        <!-- Multi-Provider Custom AI Drawer -->
        <div id="ai-config" class="ai-box hidden">
          <div class="label-row">
            <label for="provider-select">⚙️ 选择自定义生图服务（Key 仅保存在你本地浏览器）</label>
          </div>
          <div class="provider-row">
            <select id="provider-select">
              <option value="siliconflow">🇨🇳 硅基流动 SiliconFlow（国内直连 · 免费中文 Kolors）</option>
              <option value="pollinations">🌸 Pollinations 个人 Key（GitHub 登录免费领）</option>
              <option value="huggingface">🤗 Hugging Face Token（免费 FLUX.1-schnell）</option>
              <option value="gemini">💎 Google Gemini（gemini-2.5-flash-image）</option>
              <option value="openai">🔧 自定义 OpenAI 兼容接口（中转站）</option>
            </select>
          </div>
          <input id="api-key-input" type="password" placeholder="粘贴对应平台的 API Key（sk-... / AIza...）" />
          <div id="custom-endpoint-fields" class="endpoint-row hidden">
            <input id="base-url-input" type="text" placeholder="Base URL，如 https://api.siliconflow.cn/v1" />
            <input id="model-input" type="text" placeholder="模型名，如 Kwai-Kolors/Kolors" />
          </div>
          <p id="provider-hint" class="ai-hint">
            推荐：前往 <a href="https://cloud.siliconflow.cn/account/ak" target="_blank" rel="noopener">cloud.siliconflow.cn</a> 免费注册即可领取额度，默认使用国内直连免费中文模型 <code>Kwai-Kolors/Kolors</code>。
          </p>
        </div>

        <div class="cta-row">
          <button id="btn-generate" class="generate-btn" type="button">🔥 真 AI 生成魔性神图</button>
          <button id="btn-reroll" class="reroll-btn" type="button" title="换个随机种子重新生成一张更离谱的">🔄 再抽一张</button>
        </div>

        <div class="parser-box">
          <div class="parser-head">🧠 当前 AI 魔性扩写咒语 &amp; 状态</div>
          <div id="prompt-preview" class="prompt-preview">准备就绪：输入任意描述点击生成即可出图！</div>
        </div>
      </section>

      <!-- Right Canvas Preview Stage -->
      <section class="panel stage-panel">
        <div class="canvas-frame" id="canvas-frame">
          <canvas id="art-canvas" width="640" height="640"></canvas>
          <div id="loading-overlay" class="loading-overlay hidden">
            <div class="spinner">🤪</div>
            <p id="loading-text">AI 灵魂画师正在疯狂作画（约 4~8 秒）...</p>
            <small id="loading-sub" class="loading-sub">正在把你的描述魔性化并渲染高清图像</small>
          </div>
        </div>

        <div class="action-bar">
          <button id="btn-download" class="act-btn primary" type="button">💾 下载 PNG 原图</button>
          <button id="btn-copy" class="act-btn" type="button">📋 复制图片</button>
          <button id="btn-wobble" class="act-btn" type="button">🎬 鬼畜抖动预览: 关</button>
          <span id="status-toast" class="toast"></span>
        </div>

        <div class="history-wrap">
          <div class="history-head">
            <span>🖼️ 最近生成的魔性大作（点击回看）</span>
            <button id="btn-clear-hist" class="tiny-btn" type="button">清空</button>
          </div>
          <div id="history-strip" class="history-strip">
            <span class="empty-hint">正在生成第一张大作...</span>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="src/parser.js"></script>
  <script src="src/painter.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
